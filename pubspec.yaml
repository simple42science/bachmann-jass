name: bachmann_jass
description: "Schweizer Jass (Schieber und Bieterjass)"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: any
  jass_engine:
    path: packages/jass_engine
  shared_preferences: ^2.5.5

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/cards/
  fonts:
    # Vollkorn und Caveat sind variable Schriften: das Gewicht kommt ueber
    # FontVariation('wght', ...), siehe JassFonts in lib/app/theme.dart.
    - family: Vollkorn
      fonts:
        - asset: assets/fonts/Vollkorn-Variable.ttf
        - asset: assets/fonts/Vollkorn-Italic-Variable.ttf
          style: italic
    - family: AlegreyaSans
      fonts:
        - asset: assets/fonts/AlegreyaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/AlegreyaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/AlegreyaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlegreyaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlegreyaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/AlegreyaSans-ExtraBold.ttf
          weight: 800
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
