<!doctype html>
<html>

<x-dc>
<helmet>

  <style>
    body { margin: 0; font-family: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #c9973a; } a:hover { color: #e0b45a; }
    .card { position: absolute; width: 72px; height: 112px; border-radius: 5px; overflow: hidden; box-shadow: 0 8px 16px rgba(20,10,0,0.55), 0 0 0 1px rgba(0,0,0,0.25); transform-origin: 50% 100%; }
    .card img { width: 100%; height: 100%; display: block; }
    .dim::after { content: ""; position: absolute; inset: 0; background: rgba(40, 26, 10, 0.55); }
    .back { position: absolute; width: 28px; height: 44px; border-radius: 3px; background: #7a1f1f; box-shadow: inset 0 0 0 2px #c9973a, inset 0 0 0 3px #7a1f1f, inset 0 0 0 4px rgba(201,151,58,0.6), 0 3px 8px rgba(0,0,0,0.5); }
    .back::after { content: "B"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Vollkorn', Georgia, serif; font-weight: 700; font-size: 15px; color: #e0b45a; }
    .trick { position: absolute; width: 64px; height: 100px; border-radius: 4px; overflow: hidden; box-shadow: 0 10px 18px rgba(20,10,0,0.6); }
    .trick img { width: 100%; height: 100%; display: block; }
    .plate { display: flex; flex-direction: column; gap: 0; padding: 5px 12px; border-radius: 6px; background: linear-gradient(180deg, #5a3b1f, #3f2812); box-shadow: inset 0 1px 0 rgba(255,225,170,0.25), 0 2px 4px rgba(0,0,0,0.5); border: 1px solid #8a6a2f; }
  </style>
</helmet>
